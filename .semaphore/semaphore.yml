version: v1.0
name: "Operately — Nightly Build"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

blocks:
  - name: "Version"
    task:
      jobs:
        - name: "Calculate Version"
          commands:
            - git clone https://github.com/operately/operately.git
            - cd operately
            - echo "nightly-build-$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)" > version
            - artifact push workflow version

  - name: "Docker Image"
    task:
      secrets:
        - name: docker-push
      jobs:
        - name: "Build Docker Image"
          commands:
            - git clone https://github.com/operately/operately.git
            - cd operately
            - artifact pull workflow version
            # Override DOCKER_IMAGE_TAGS so we do not also stamp :latest (that tag
            # is published by Operately main CI).
            - make docker.buildx.setup
            - 'make docker.buildx.push DOCKER_IMAGE_TAGS="-t operately/operately:$(cat version)"'
            - docker buildx imagetools inspect operately/operately:$(cat version)

  - name: "GitHub Release"
    task:
      secrets:
        - name: github-release-api-key
      jobs:
        - name: "Build GitHub Release"
          commands:
            - sem-version erlang 27
            - kiex install 1.17.0
            - sem-version elixir 1.17.0
            - git clone https://github.com/operately/operately.git
            - cd operately
            - mix local.rebar --force
            - artifact pull workflow version
            - make release.build.singlehost VERSION=$(cat version)
            - make release.push.github.release VERSION=$(cat version) GITHUB_REPOSITORY=operately/nightly

after_pipeline:
  task:
    secrets:
      - name: discord-bot
    jobs:
      - name: "Notify Discord"
        commands:
          - checkout
          - artifact pull workflow version
          - ruby discord.rb $(cat version)

promotions:
  - name: Publish official release
    pipeline_file: publish.yml
    parameters:
      env_vars:
        - required: true
          description: Release version
          name: RELEASE_VERSION
